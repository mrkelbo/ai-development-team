name: Validate Claude Code plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate marketplace and agents
        run: python3 scripts/validate_package.py
